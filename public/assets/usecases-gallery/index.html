<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Noumi Use Cases Gallery</title>
    <link rel="stylesheet" href="/assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <div class="page">
      <div class="hero">
        <h1 class="hero-title" id="heroTitle"></h1>
        <a class="hero-cta" id="heroCta" href="https://www.noumi.ai/auth" target="_blank" rel="noopener noreferrer">
          <span class="prototype-button-content">
            <span class="prototype-button-label" id="heroCtaLabel">Deliver with Noumi</span>
            <img aria-hidden="true" alt="" class="prototype-button-arrow" src="/assets/redesign/arrow.svg">
            <img aria-hidden="true" alt="" class="prototype-button-arrow prototype-button-arrow--incoming" src="/assets/redesign/arrow.svg">
          </span>
        </a>
      </div>
      <nav class="pill-group" id="pillGroup" aria-label="Use case categories"></nav>
      <div class="stage"><div class="stage-card">
        <div class="sidebar" id="sidebar" aria-label="Use case tasks"></div>
        <div class="content" id="stageContent"><div class="case-fade" id="caseFade"></div></div>
      </div></div>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview" aria-hidden="true">
      <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close"></button>
      <img class="lightbox-img" id="lightboxImg" alt="" />
    </div>
    <noscript>Enable JavaScript to explore the interactive use cases.</noscript>
    <script src="assets/app.js" defer></script>
  </body>
</html>
